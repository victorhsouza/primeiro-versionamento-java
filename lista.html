<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            height: 250px;
            list-style-type: none;
            display: flex;
            flex-direction: column;
            /* Alinha os elementos no eixo principal que foi definido no flex-direciton. Por padrão ele vem como row(linha) */
            /* Flex-start - Alinha os elementos no incio do container */
            /* Center = Alinhas os elementos no centro do container */
            /* Flex-end - Alinha os elementos no final do container */
            /* space-between - Da um espaço entre os elementos */
            /* space-around - Um espaço ao redor dos elementos */
            /* space-evenly - Um espacamentos maior ao redor */
            justify-content: space-between ;
            align-items: flex-end;
            border: 1px solid red;
            /* gap: 50px; */
            
            
        }
    </style>
</head>
<body>

    <ul>
        <li>Victor</li>
        <li>Amanda</li>
        <li>Gabriel</li>
        <li>Pedro</li>
    </ul>

    <ol>
        <li> Segunda </li>
        <li> Terça </li>
        <li> Quarta</li>
    </ol>


</body>
</html>
